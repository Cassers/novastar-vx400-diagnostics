name: Windows NovaStar Pro and Users tests
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Double-click launchers prepare downloaded scripts
        shell: powershell
        run: .\tests\Launchers.Windows.Tests.ps1
      - name: Windows PowerShell 5.1 protocol tests
        shell: powershell
        run: .\tests\Protocol.Tests.ps1
      - name: VX400 and VX600 connection selection and USB framing
        shell: powershell
        run: |
          .\tests\Connection.Tests.ps1
          .\tests\Usb.Tests.ps1
      - name: Pro password policy and native access dialogs
        shell: powershell
        run: |
          .\tests\ProContext.Tests.ps1
          .\tests\ProAccess.Tests.ps1
          & "$env:SystemRoot\System32\WindowsPowerShell\v1.0\powershell.exe" -NoProfile -STA -File .\tests\ProAccessGui.Tests.ps1
          if ($LASTEXITCODE -ne 0) { throw 'Pro access dialogs failed' }
      - name: Real Pro login and duplicate-window activation
        if: ${{ !cancelled() }}
        shell: powershell
        run: .\tests\ProStartup.Windows.Tests.ps1
      - name: Users engine, deployment and media rules
        shell: powershell
        run: |
          .\tests\Operator.Tests.ps1
          .\tests\OperatorDeployment.Tests.ps1
          & "$env:SystemRoot\System32\WindowsPowerShell\v1.0\powershell.exe" -NoProfile -STA -File .\tests\OperatorMedia.Tests.ps1
          if ($LASTEXITCODE -ne 0) { throw 'Native media rules failed' }
          python .\tests\operator_runtime_tests.py
      - name: Users and Pro configurator native interfaces
        if: ${{ !cancelled() }}
        shell: powershell
        run: .\tests\OperatorGui.Tests.ps1
      - name: Interactive user startup registration without execution
        if: ${{ !cancelled() }}
        shell: powershell
        run: .\tests\OperatorStartup.Windows.Tests.ps1
      - name: VX600 manual layer protocol and simulator
        shell: powershell
        run: |
          .\tests\Layer.Tests.ps1
          python .\tests\layer_runtime_tests.py
      - name: GUI elevation mutex handoff
        shell: powershell
        run: .\tests\GuiHandoff.Tests.ps1
      - name: Gradual-ramp planning without network
        shell: powershell
        run: .\tests\Ramp.Tests.ps1
      - name: Local fake VX400 integration tests
        shell: powershell
        run: python .\tests\runtime_tests.py
      - name: Hardware-view fallback without NovaLCT
        shell: powershell
        run: .\Test-Vx400.ps1 -InventoryOnly -CaptureNovaLctHardwareInfo -AssumeLatestFirmware -OutputDirectory "$env:RUNNER_TEMP\vx400-inventory"
      - name: Watcher against local fake VX400 only
        shell: powershell
        run: |
          .\Watch-Vx400.ps1 -ValidateOnly
          python .\tests\watcher_tests.py
      - name: Protected Windows scheduled-task installer
        shell: powershell
        run: .\tests\Installer.Tests.ps1
      - name: Daily plan math and validation
        shell: powershell
        run: .\tests\Plan.Tests.ps1
      - name: Plan lifecycle on local simulator only
        shell: powershell
        run: python .\tests\plan_runtime_tests.py
      - name: Read-only connection probe against local simulator
        shell: powershell
        run: python .\tests\probe_runtime_tests.py
      - name: Native Windows interface and screenshots
        if: ${{ !cancelled() }}
        shell: powershell
        run: .\tests\Gui.Tests.ps1
      - name: Controller ownership identification rules
        if: ${{ !cancelled() }}
        shell: powershell
        run: .\tests\Ownership.Tests.ps1
      - name: Recovery against disposable local controllers only
        if: ${{ success() }}
        shell: powershell
        run: .\tests\Ownership.Windows.Tests.ps1
      - name: Native control task installation and migration
        if: ${{ success() }}
        shell: powershell
        run: .\tests\ControlInstaller.Tests.ps1
      - name: Native interface screenshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: vx400-native-ui
          path: |
            ${{ runner.temp }}/vx400-gui
            ${{ runner.temp }}/vx-operator-gui
            ${{ runner.temp }}/vx-pro-access-gui
          if-no-files-found: ignore
